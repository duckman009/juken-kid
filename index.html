<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>毎日のテスト</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --sub:#5d6678; --line:#e3e6ec;
  --accent:#2747a0; --on-accent:#ffffff; --accent-soft:#e8edf9;
  --good:#1f8a5b; --warn:#a86500; --bad:#c23b3b; --scrim:rgba(20,23,29,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171d; --panel:#1d222b; --ink:#e7eaf0; --sub:#9aa3b5; --line:#2e3542;
    --accent:#8fa8ff; --on-accent:#10162a; --accent-soft:#25304a;
    --good:#4cc38a; --warn:#f0a940; --bad:#f07070; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:17px;line-height:1.65}
header{background:var(--accent);color:var(--on-accent);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;text-align:center}
header h1{margin:0;font-size:19px;font-weight:600}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 6px}
.ttl{font-size:19px;margin:12px 0}
.card.ok{border-left:4px solid var(--good)} .card.ng{border-left:4px solid var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .between{justify-content:space-between}
.center{text-align:center}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.muted{color:var(--sub);font-size:13px}
.foot{text-align:center;margin-top:20px}
.q{margin:8px 0;font-size:18px}
.fig{margin:6px 0;color:var(--ink)}
.res{margin-top:10px;padding:10px;border-radius:8px;background:var(--bg)}
.okc{color:var(--good);font-size:18px} .ngc{color:var(--bad);font-size:18px}
input[type=text],input:not([type]),textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
textarea.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;margin:8px 0}
label{display:block;padding:4px 0}
input[type=radio]{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:8px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.big{padding:12px 36px;font-size:18px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#ask{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#ask[hidden]{display:none}
#ask .card{max-width:380px;width:100%;margin:0}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>毎日のテスト</h1></header>
<main id="main"><div class="card"><p>読み込んでいます…</p></div></main>
<div id="ask" hidden role="dialog" aria-modal="true"><div class="card"><p id="askMsg" style="margin:0 0 12px"></p>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="askNo">やめる</button><button class="btn" id="askOk">採点する</button></div></div></div>
<div id="toast" hidden role="status"></div>
<script>/* 追加の知識問題（新しいテスト結果に合わせて追記していく問題集）
 * 書式:
 *   選択式: {id:'x1', unit:'body', level:1, type:'choice', q:'問題文', choices:['正解','誤り1','誤り2','誤り3'], explain:'解説'}
 *   記述式: {id:'x2', unit:'kokugo', level:2, type:'text', q:'問題文', accept:['正解','別解'], explain:'解説'}
 *   数値式: {id:'x3', unit:'weather', level:3, type:'num', q:'問題文', ans:78.4, explain:'解説', suffix:'度'}
 * unit: calc / speed / ratio / simil / angle / number / kokugo / heat / lever / body / weather / history / geo
 * choices は最初が正解（表示時にシャッフルされる）。id は既存と重複させないこと。
 */
window.EXTRA_BANK = [
];
</script>
<script>/* 週末テスト：弱点対策ドリル
 * - 算数・理科計算は数値を変えて毎回自動生成（generators）
 * - 知識問題は問題集（BANK + extra-questions.js の EXTRA_BANK）から出題
 * - 出題配分は「弱点の状況・過去の正誤・最新テストの誤答・教科偏差値」で毎週再計算
 */
(function(){
'use strict';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 単元 ---------- */
const UNITS = {
  calc:{name:'計算',subj:'算数'}, speed:{name:'速さ',subj:'算数'}, ratio:{name:'割合と比',subj:'算数'},
  simil:{name:'図形と比（相似）',subj:'算数'}, angle:{name:'角度・多角形',subj:'算数'}, number:{name:'数の性質',subj:'算数'},
  kokugo:{name:'ことわざ・漢字',subj:'国語'},
  heat:{name:'熱量',subj:'理科'}, lever:{name:'てこ',subj:'理科'}, body:{name:'人体・生物',subj:'理科'}, weather:{name:'気象・天体',subj:'理科'},
  history:{name:'歴史（縄文〜平安）',subj:'社会'}, geo:{name:'地理',subj:'社会'},
};
const SUBJ_ORDER = ['算数','国語','理科','社会'];
const SUBJ_KEY = {'算数':'math','国語':'jpn','理科':'sci','社会':'soc'};
const WEAK_UNIT_MAP = {1:['calc'],2:['speed'],3:['ratio','simil'],4:['angle'],5:['heat'],6:['lever'],7:['body'],8:['history'],9:['kokugo'],10:[]};
const UNIT_RULES = [
  ['speed',/速さ|旅人|流水|時計|通過|ダイヤグラム/],['simil',/相似|図形と比|辺の比|面積比/],
  ['ratio',/割合|比|相当|損益|売買|濃さ|食塩水|平均/],['angle',/角|多角形/],['number',/約数|倍数|数の性質|既約|数に関する|規則/],['calc',/計算/],
  ['heat',/熱|あたたま|温度/],['lever',/てこ|滑車|輪軸|力の|ばね/],
  ['weather',/気象|天気|前線|台風|月|太陽|天体|星|雲/],['body',/消化|人体|生物|光合成|植物|動物|昆虫|食物|栄養|アゲハ|つり合い/],
  ['history',/時代|歴史|天皇|古墳|遺跡|貝塚|律令|土偶|妹子|太子|政治|文化|外交/],['geo',/地理|県|国土|農|工業|漁業|地名|島|川|気候|海岸|都市/],
  ['kokugo',/漢字|ことわざ|慣用句|熟語|語/],
];
function unitOf(subj,text){
  for(const [u,re] of UNIT_RULES){ if(UNITS[u].subj===subj && re.test(text||'')) return u; }
  return null;
}

/* ---------- 乱数・分数 ---------- */
function rngFrom(seed){ let a=seed>>>0; return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}; }
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const F=(n,d=1)=>{ if(d<0){n=-n;d=-d;} const g=gcd(n,d)||1; return {n:n/g,d:d/g}; };
const fadd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d), fsub=(a,b)=>F(a.n*b.d-b.n*a.d,a.d*b.d);
const fmul=(a,b)=>F(a.n*b.n,a.d*b.d), fdiv=(a,b)=>F(a.n*b.d,a.d*b.n);
const fval=a=>a.n/a.d;
function fstr(a){ if(a.d===1) return String(a.n); const w=Math.floor(a.n/a.d), r=a.n-w*a.d; return w?`${w}と${r}/${a.d}`:`${a.n}/${a.d}`; }
const imp=a=>a.d===1?String(a.n):`${a.n}/${a.d}`;

/* ---------- 問題ジェネレーター（数値を変えて毎回新しい問題） ---------- */
function G(r){
  const ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const pick=arr=>arr[Math.floor(r()*arr.length)];
  const until=(make)=>{for(let i=0;i<200;i++){const v=make(); if(v) return v;} throw new Error('gen failed');};
  return {ri,pick,until};
}
const num=(text,ans,ansText,explain,suffix)=>({type:'num',text,ans,ansText:ansText??String(ans),explain,suffix});

const GENS = [
  /* 計算 */
  {id:'calc-frac',unit:'calc',level:1,fn(r){const {ri,pick,until}=G(r);
    const ds=[2,3,4,5,6,8,9,10,12];
    let A,C,plus;
    until(()=>{const b=pick(ds),d=pick(ds); A=fadd(F(ri(1,b-1),b),F(ri(0,2))); C=F(ri(1,d-1),d);
      return A.d!==C.d && fval(A)!==fval(C);});
    plus=r()<.5;
    if(!plus && fval(A)<fval(C)) [A,C]=[C,A];
    const R=plus?fadd(A,C):fsub(A,C), L=lcm(A.d,C.d), op=plus?'+':'−';
    const na=A.n*L/A.d, nc=C.n*L/C.d;
    return num(`${fstr(A)} ${op} ${fstr(C)} を計算しなさい。`,fval(R),fstr(R),
      `帯分数は仮分数に直し、分母を${L}にそろえる（通分）。\n${imp(A)} ${op} ${imp(C)} = ${na}/${L} ${op} ${nc}/${L} = ${plus?na+nc:na-nc}/${L} = ${fstr(R)}`);}},
  {id:'calc-kufu',unit:'calc',level:1,fn(r){const {ri,pick}=G(r);
    const [k,k100]=pick([['3.14',314],['2.5',250],['1.7',170],['0.48',48]]), total=pick([10,20,100]);
    const a=ri(2,total-2), b=total-a, ans=k100*total/100;
    return num(`${k} × ${a} + ${k} × ${b} を工夫して計算しなさい。`,ans,String(ans),
      `同じ数 ${k} でまとめる（分配法則）。\n${k} × (${a} + ${b}) = ${k} × ${total} = ${ans}`);}},
  {id:'calc-dec',unit:'calc',level:2,fn(r){const {ri,pick}=G(r);
    const [ds,v1]=pick([['0.25',F(1,4)],['0.75',F(3,4)],['0.5',F(1,2)],['0.2',F(1,5)],['0.4',F(2,5)],['0.6',F(3,5)],['0.125',F(1,8)],['1.25',F(5,4)],['1.5',F(3,2)]]);
    const d=pick([3,6,9,12,8]), v2=F(ri(1,d-1),d), v3=F(ri(1,9),ri(2,9));
    const s1=fadd(v1,v2), R=fdiv(s1,v3);
    return num(`(${ds} + ${fstr(v2)}) ÷ ${imp(v3)} を計算しなさい。`,fval(R),fstr(R),
      `小数は分数に直す：${ds} = ${imp(v1)}\nかっこの中：${imp(v1)} + ${imp(v2)} = ${fstr(s1)}\nわり算は逆数をかける：${imp(s1)} × ${v3.d}/${v3.n} = ${fstr(R)}`);}},
  {id:'calc-box-int',unit:'calc',level:2,fn(r){const {ri}=G(r);
    const x=ri(3,30), a=ri(1,x-1), b=ri(2,9), c=ri(1,40), d=(x-a)*b+c;
    return num(`(□ − ${a}) × ${b} + ${c} = ${d}　□にあてはまる数を答えなさい。`,x,String(x),
      `最後に計算したものから順にもどす（逆算）。\n${d} − ${c} = ${d-c}\n${d-c} ÷ ${b} = ${x-a}\n${x-a} + ${a} = ${x}`);}},
  {id:'calc-box-frac',unit:'calc',level:3,fn(r){const {ri,pick,until}=G(r);
    return until(()=>{
      const x=F(ri(1,11),pick([2,3,4,5,6])), p=F(ri(1,5),pick([2,3,4,5,6,7])), q=F(ri(1,5),pick([2,3,4,6]));
      const R=fsub(fmul(x,p),q); if(fval(R)<=0) return null; const t=fadd(R,q);
      return num(`□ × ${imp(p)} − ${imp(q)} = ${fstr(R)}　□にあてはまる数を答えなさい。`,fval(x),fstr(x),
        `逆算する。\n${fstr(R)} + ${fstr(q)} = ${fstr(t)}\n${fstr(t)} ÷ ${imp(p)} = ${imp(t)} × ${p.d}/${p.n} = ${fstr(x)}`);});}},

  /* 速さ */
  {id:'speed-basic',unit:'speed',level:1,fn(r){const {ri,pick,until}=G(r); const v=ri(0,2);
    if(v===0) return until(()=>{const a=pick([3,4,5,6,9,12,15,18,36,45,54,60,72]), b=pick([10,15,20,30,40,45,50]);
      if((a*b*1000)%60) return null; const ans=a*b*1000/60;
      return num(`時速${a}kmで${b}分間進むと、何m進みますか。`,ans,String(ans),
        `${b}分 = ${b}/60時間。道のり = 速さ × 時間\n${a} × ${b}/60 = ${fstr(F(a*b,60))}km = ${ans}m（1km = 1000m）`,'m');});
    if(v===1){const sp=pick([50,60,70,75,80,120,150,200,250]), t=ri(5,30), D=sp*t;
      return num(`分速${sp}mで${D}m進むのに何分かかりますか。`,t,String(t),`時間 = 道のり ÷ 速さ\n${D} ÷ ${sp} = ${t}分`,'分');}
    const s=pick([5,10,15,20,25]), ans=s*36/10;
    return num(`秒速${s}mは、時速何kmですか。`,ans,String(ans),`秒速${s}m → 分速 ${s}×60 = ${s*60}m → 時速 ${s*60}×60 = ${s*3600}m = ${ans}km`,'km');}},
  {id:'speed-meet',unit:'speed',level:2,fn(r){const {ri,pick,until}=G(r);
    if(r()<.5){const v1=pick([40,50,60,70,80,90]), v2=pick([50,60,70,80,100,120]), t=ri(5,20), D=(v1+v2)*t;
      return num(`${D}mはなれたところにいる姉と妹が、向かい合って同時に歩き始めました。姉は分速${v2}m、妹は分速${v1}mです。2人は何分後に出会いますか。`,t,String(t),
        `2人の間の道のりは、1分間に ${v2} + ${v1} = ${v1+v2}m ずつ縮まる。\n${D} ÷ ${v1+v2} = ${t}分後`,'分');}
    return until(()=>{const v1=pick([50,60,70,80]), diff=pick([10,20,30,40,50]), v2=v1+diff, t0=ri(3,15);
      if((v1*t0)%diff) return null; const c=v1*t0/diff; if(c>40) return null;
      return num(`妹が分速${v1}mで家を出発し、その${t0}分後に姉が分速${v2}mで同じ道を追いかけました。姉は出発してから何分後に妹に追いつきますか。`,c,String(c),
        `姉が出発したとき、妹は ${v1} × ${t0} = ${v1*t0}m 先にいる。\n1分間に ${v2} − ${v1} = ${diff}m ずつ近づくので、${v1*t0} ÷ ${diff} = ${c}分後`,'分');});}},
  {id:'speed-stream',unit:'speed',level:2,fn(r){const {ri,until}=G(r);
    if(r()<.4){const s=ri(8,15), rv=ri(1,4), up=s-rv, T=ri(2,5), D=up*T;
      return num(`静水での速さが時速${s}kmの船が、流れの速さが時速${rv}kmの川を${D}kmさかのぼります（上ります）。何時間かかりますか。`,T,String(T),
        `上りの速さ = 静水での速さ − 流れの速さ = ${s} − ${rv} = ${up}km/時\n${D} ÷ ${up} = ${T}時間`,'時間');}
    return until(()=>{const u=ri(6,14), rv=ri(1,4), d=u+2*rv, D=lcm(u,d)*ri(1,2); if(D>150) return null;
      const T1=D/u, T2=D/d, askRiver=r()<.5;
      return num(`ある船が、川ぞいの${D}kmはなれた2地点を往復しました。上りに${T1}時間、下りに${T2}時間かかりました。${askRiver?'川の流れの速さ':'静水での船の速さ'}は時速何kmですか。`,
        askRiver?rv:u+rv,String(askRiver?rv:u+rv),
        `上りの速さ ${D} ÷ ${T1} = ${u}km/時、下りの速さ ${D} ÷ ${T2} = ${d}km/時\n`+
        (askRiver?`流れの速さ = (下り − 上り) ÷ 2 = (${d} − ${u}) ÷ 2 = ${rv}`:`静水での速さ = (下り + 上り) ÷ 2 = (${d} + ${u}) ÷ 2 = ${u+rv}`),'km');});}},
  {id:'speed-clock',unit:'speed',level:3,fn(r){const {ri}=G(r);
    if(r()<.5){const h=ri(1,11), m=2*ri(1,29), a=Math.abs(30*h-5.5*m), ang=Math.min(a,360-a);
      return num(`${h}時${m}分のとき、時計の長針と短針がつくる角のうち、小さいほうの角度は何度ですか。`,ang,String(ang),
        `長針は1分に6度、短針は1分に0.5度進むので、1分に5.5度ずつ差が変わる。\n${h}時ちょうどの角度は 30 × ${h} = ${30*h}度。\n${m}分間で 5.5 × ${m} = ${5.5*m}度 変わるので、|${30*h} − ${5.5*m}| = ${a}度。`+
        (a>180?`\n180度をこえるので 360 − ${a} = ${ang}度`:''),'度');}
    const h=ri(1,10), m=F(60*h,11);
    return num(`${h}時と${h+1}時の間で、長針と短針がぴったり重なるのは${h}時何分ですか（帯分数で答えてよい）。`,fval(m),fstr(m),
      `${h}時ちょうどに、長針は短針の ${30*h}度 うしろにいる。\n1分に 6 − 0.5 = 5.5度 ずつ追いつくので、${30*h} ÷ 5.5 = ${30*h} × 2/11 = ${fstr(m)}分`,'分');}},
  {id:'speed-tsurukame',unit:'speed',level:3,fn(r){const {ri,pick,until}=G(r);
    return until(()=>{const a=pick([50,60,70,80]), b=pick([120,140,150,160,180,200]), x=ri(3,15), y=ri(3,15), D=a*x+b*y, T=x+y;
      return num(`家から${D}mはなれた駅まで、はじめは分速${a}mで歩き、途中から分速${b}mで走ったところ、全部で${T}分かかりました。歩いた時間は何分ですか。`,x,String(x),
        `全部 ${T}分 走ったとすると ${b} × ${T} = ${b*T}m。実際との差は ${b*T} − ${D} = ${b*T-D}m。\n走る1分を歩く1分にかえるごとに ${b} − ${a} = ${b-a}m ずつ減るので、${b*T-D} ÷ ${b-a} = ${x}分（速さのつるかめ算）`,'分');});}},

  /* 割合と比 */
  {id:'ratio-simplify',unit:'ratio',level:1,fn(r){const {ri,pick,until}=G(r);
    return until(()=>{
      if(r()<.5){const p=ri(1,9), q=ri(1,9); if(p===q||gcd(p,q)!==1) return null; const k=pick([1,2,3,4,5]);
        const x=p*k/10, y=q*k/10;
        return {type:'ratio',text:`${x} : ${y} を、もっとも簡単な整数の比で答えなさい。（例 2:3）`,ans:[p,q],ansText:`${p}:${q}`,
          explain:`両方を10倍すると ${p*k}:${q*k}。最大公約数 ${k} でわって ${p}:${q}`};}
      const b=ri(2,9), d=ri(2,9), a=ri(1,b-1), c=ri(1,d-1); if(gcd(a,b)!==1||gcd(c,d)!==1||b===d) return null;
      const L=lcm(b,d), x=a*L/b, y=c*L/d, g=gcd(x,y);
      return {type:'ratio',text:`${a}/${b} : ${c}/${d} を、もっとも簡単な整数の比で答えなさい。（例 2:3）`,ans:[x/g,y/g],ansText:`${x/g}:${y/g}`,

  {id:'ratio-split',unit:'ratio',level:1,fn(r){const {ri,pick,until}=G(r);

  {id:'ratio-renhi',unit:'ratio',level:2,fn(r){const {ri,until}=G(r);

  {id:'ratio-soutou',unit:'ratio',level:2,fn(r){const {pick}=G(r);

  {id:'ratio-baibai',unit:'ratio',level:3,fn(r){const {ri,pick,until}=G(r);

  /* 図形と比 */
  {id:'simil-pyramid',unit:'simil',level:1,fn(r){const {ri}=G(r);

  {id:'simil-hourglass',unit:'simil',level:2,fn(r){const {ri,until}=G(r);

  {id:'simil-area',unit:'simil',level:3,fn(r){const {ri}=G(r);

      `相似比 AD:AB = ${a}:${a+b} → 面積比は ${a}×${a}:${a+b}×${a+b} = ${a*a}:${(a+b)**2}\n三角形ABC = ${S} ÷ ${a*a} × ${(a+b)**2} = ${big}cm²\n四角形DBCE = ${big} − ${S} = ${ans}cm²`,'cm²'),svg:'pyramid'};}},

  /* 角度・多角形 */
  {id:'angle-regular',unit:'angle',level:1,fn(r){const {pick}=G(r);
    const n=pick([5,6,8,9,10,12,15,18,20]);
    if(r()<.5) return num(`正${n}角形の1つの内角は何度ですか。`,180*(n-2)/n,String(180*(n-2)/n),
      `内角の和は 180 × (${n} − 2) = ${180*(n-2)}度。\n正多角形なので ${180*(n-2)} ÷ ${n} = ${180*(n-2)/n}度\n（外角 360 ÷ ${n} = ${360/n}度 を180度から引いてもよい）`,'度');
    return num(`正${n}角形の1つの外角は何度ですか。`,360/n,String(360/n),`多角形の外角の和はいつも360度。\n360 ÷ ${n} = ${360/n}度`,'度');}},
  {id:'angle-sum',unit:'angle',level:2,fn(r){const {ri,pick}=G(r); const v=ri(0,2);

    if(v===1){const n=ri(5,12); return num(`${n}角形の内角の和は何度ですか。`,180*(n-2),String(180*(n-2)),`1つの頂点から対角線を引くと、三角形が ${n} − 2 = ${n-2}個できる。\n180 × ${n-2} = ${180*(n-2)}度`,'度');}
    const x=pick([108,120,135,140,144,150,156,160,162]), n=360/(180-x);

  {id:'angle-diag',unit:'angle',level:3,fn(r){const {ri}=G(r); const n=ri(5,14), dg=n*(n-3)/2;
    if(r()<.5) return num(`${n}角形の対角線は全部で何本ありますか。`,dg,String(dg),

  /* 数の性質 */
  {id:'number-div',unit:'number',level:1,fn(r){const {pick}=G(r);
    const N=pick([12,18,20,24,28,30,36,40,45,48,60,72,84,90,96,100]);

    const fac={}; let m=N; for(let p=2;p<=m;p++) while(m%p===0){fac[p]=(fac[p]||0)+1;m/=p;}
    const fs=Object.entries(fac).map(([p,e])=>e>1?`${p}^${e}`:p).join(' × '), es=Object.values(fac).map(e=>`(${e}+1)`).join(' × ');

  {id:'number-gcd',unit:'number',level:2,fn(r){const {ri,pick,until}=G(r);

    return until(()=>{const g=pick([2,3,4,5,6,7,8,9,12]), x=ri(2,9), y=ri(2,9); if(x===y||gcd(x,y)!==1) return null;

  {id:'number-ie',unit:'number',level:3,fn(r){const {pick,until}=G(r);

      const fa=Math.floor(N/a), fb=Math.floor(N/b), fl=Math.floor(N/L), ans=N-fa-fb+fl;

  /* 理科：熱量 */

      `上がる温度 = 熱量 ÷ 水の重さ = ${w*dt} ÷ ${w} = ${dt}℃\n${t1} + ${dt} = ${t1+dt}℃`,'℃');}},
  {id:'heat-mix',unit:'heat',level:2,fn(r){const {ri,pick,until}=G(r);

  /* 理科：てこ */
  {id:'lever-basic',unit:'lever',level:1,fn(r){const {pick,until}=G(r);

  {id:'lever-rod',unit:'lever',level:3,fn(r){const {pick,until}=G(r);

      return num(`長さ${L}cm、重さ${W}gの太さが一様な棒があります。左はしから${p}cmのところを支点にして、左はしにおもりをつるして棒を水平につり合わせるには、何gのおもりが必要ですか。`,x,String(x),
        `太さが一様な棒の重さは、まん中（左はしから${L/2}cm）にかかると考える。\n支点からまん中までは ${L/2} − ${p} = ${L/2-p}cm\n${W} × ${L/2-p} = □ × ${p} → □ = ${x}g`,'g');});}},
];

  TX('k6','kokugo',2,'□にあてはまる漢字（漢数字）を答えなさい：「□階から目薬」',['二','2'],'思うようにいかず、もどかしいこと。効果がないこと。'),

  TX('k8','kokugo',2,'□にあてはまる漢字（漢数字）を答えなさい：「仏の顔も□度まで」',['三','3'],'どんなにおだやかな人でも、何度もひどいことをされればおこる。'),
  TX('k9','kokugo',2,'□にあてはまる漢字（漢数字）を答えなさい：「□里の道も一歩から」',['千','1000'],'大きなことも、身近な一歩から始まる。'),
  C('k10','kokugo',3,'「情けは人のためならず」の意味として正しいものはどれですか。',['人に親切にすれば、めぐりめぐって自分に返ってくる','人に情けをかけると、その人のためにならない','情けは自分のためにかけるものではない','人に親切にしても意味がない'],'よくまちがえられる意味。「ためにならない」ではなく、「自分にかえってくる」。'),
  TX('k11','kokugo',1,'「竹馬の友」の「竹馬」の読みをひらがなで答えなさい。',['ちくば'],'竹馬の友（ちくばのとも）＝幼なじみ。'),
  TX('k12','kokugo',2,'「境内」の読みをひらがなで答えなさい。',['けいだい'],'神社や寺のしき地のこと。'),
  TX('k13','kokugo',2,'「発端」の読みをひらがなで答えなさい。',['ほったん'],'物事の始まり。'),

  TX('k15','kokugo',3,'「格子」の読みをひらがなで答えなさい。',['こうし'],'細い木などを縦横に組んだもの。'),
  C('k16','kokugo',1,'「戦いをやめること」を表す「テイセン」の正しい漢字はどれですか。',['停戦','定戦','低戦','停線'],'「停」はとめる・とどまるの意味。停止・停車。'),
  C('k17','kokugo',1,'「本をカりる」の「カ」の正しい漢字はどれですか。',['借','貸','仮','化'],'借りる（自分が受け取る）／貸す（人にわたす）。'),
  C('k18','kokugo',2,'「アンケートにカイトウする」の「カイトウ」の正しい漢字はどれですか。',['回答','解答','会頭','快投'],'問いかけ・質問に答える＝回答。問題を解いて答える＝解答。'),
  C('k19','kokugo',2,'「意見をデンタツする」の「デンタツ」の正しい漢字はどれですか。',['伝達','伝立','電達','伝建'],'伝達＝伝えとどけること。'),
  C('k20','kokugo',2,'「みんなとキョウチョウして作業する」の「キョウチョウ」の正しい漢字はどれですか。',['協調','強調','共調','協長'],'協調＝力を合わせること。強調＝強く主張すること。'),
];
const allBank=()=>BANK.concat(Array.isArray(window.EXTRA_BANK)?window.EXTRA_BANK.filter(b=>b&&b.id&&UNITS[b.unit]):[]);

/* ---------- 採点 ---------- */
const toHalf=s=>String(s??'').replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ').replace(/[−－ー]/g,m=>m);
const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function parseNum(s){
  s=toHalf(s).replace(/,/g,'').replace(/[^\d.\/と\s]/g,' ').trim().replace(/\s+/g,' ');
  let m;
  if((m=s.match(/^(\d+)\s*と\s*(\d+)\s*\/\s*(\d+)$/))||(m=s.match(/^(\d+) (\d+)\/(\d+)$/))) return +m[1]+m[2]/m[3];
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))) return m[1]/m[2];
  if(/^\d+(\.\d+)?$/.test(s)) return +s;
  return NaN;
}
function parseRatio(s){
  const p=toHalf(s).split(/[:：]/).map(x=>parseNum(x));
  if(p.length<2||p.some(x=>isNaN(x)||!Number.isInteger(x)||x<=0)) return null;
  const g=p.reduce((a,b)=>gcd(a,b)); return p.map(x=>x/g);
}
const normText=s=>kata2hira(toHalf(s).replace(/\s/g,''));
function isCorrect(it,u){
  if(u===''||u==null) return false;
  if(it.type==='num'){const v=parseNum(u); return !isNaN(v)&&Math.abs(v-it.ans)<1e-6;}
  if(it.type==='ratio'){const v=parseRatio(u); return !!v&&v.length===it.ans.length&&v.every((x,i)=>x===it.ans[i]);}
  if(it.type==='text') return it.ans.map(normText).includes(normText(u));
  if(it.type==='choice') return +u===it.ans;
  return false;
}


/* ---------- 問題の作成 ---------- */
function makeItem(src,unit,level,reasons,seed){
  if(seed==null) seed=Math.floor(Math.random()*2147483647);
  const r=rngFrom(seed);
  const base={uid:Math.random().toString(36).slice(2,10),unit,level,reasons:reasons||[],user:'',ok:null,seed};
  if(src.fn){ const g=src.fn(r); return {...base,src:'gen',ref:src.id,...g}; }
  if(src.type==='choice'){
    const order=src.choices.map((c,i)=>({c,i,k:r()})).sort((a,b)=>a.k-b.k);
    return {...base,src:'bank',ref:src.id,type:'choice',text:src.q,choices:order.map(o=>o.c),ans:order.findIndex(o=>o.i===0),ansText:src.choices[0],explain:src.explain};
  }
  if(src.type==='text') return {...base,src:'bank',ref:src.id,type:'text',text:src.q,ans:src.accept,ansText:src.accept[0],explain:src.explain,suffix:src.suffix};
  return {...base,src:'bank',ref:src.id,type:'num',text:src.q,ans:src.ans,ansText:String(src.ans),explain:src.explain,suffix:src.suffix};
}

/* 問題の「設計図」[出題元, 単元, レベル, 種] から同じ問題を作り直す（子ども用ページが使う） */
function itemFromSpec(sp){
  const [ref,unit,level,seed]=sp;
  const src=GENS.find(x=>x.id===ref)||allBank().find(x=>x.id===ref);
  if(!src) throw new Error('unknown question: '+ref);
  return makeItem(src,unit,level,[],seed);
}
const specOf=it=>[it.ref,it.unit,it.level,it.seed];
/* 問題集・生成器の内容が変わったら変わる値。ポータルと子ども用ページのバージョンが合っているか確かめる */
const CODE_VER=1;
function qv(){
  let h=5381; const s=JSON.stringify([CODE_VER,allBank().map(b=>[b.id,b.q,b.choices||b.accept||b.ans,b.explain]),GENS.map(g=>[g.id,g.unit,g.level])]);
  for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0;
  return h.toString(36);
}
/* ---------- 図 ---------- */
const SVG={
  pyramid:`<svg viewBox="0 0 240 160" width="240" role="img" aria-label="三角形ABCと平行線DE"><g fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="120,12 20,148 220,148"/><line x1="76" y1="72" x2="164" y2="72"/></g>
    <g font-size="13" fill="currentColor"><text x="115" y="10">A</text><text x="6" y="155">B</text><text x="224" y="155">C</text><text x="60" y="76">D</text><text x="168" y="76">E</text></g></svg>`,

    <g font-size="13" fill="currentColor"><text x="58" y="16">A</text><text x="152" y="16">B</text><text x="6" y="152">C</text><text x="222" y="152">D</text><text x="112" y="74">O</text></g></svg>`,
};


/* ---------- 画面部品 ---------- */
const stars=l=>'★'.repeat(l)+'☆'.repeat(3-l);
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
function inputHtml(it,dis){
  if(it.type==='choice') return it.choices.map((c,i)=>`<label style="display:block;margin:3px 0"><input type="radio" name="q${it.uid}" value="${i}" data-ans="${it.uid}" ${String(it.user)===String(i)?'checked':''} ${dis}> ${esc(c)}</label>`).join('');
  const ph=it.type==='ratio'?'例 2:3':it.type==='num'?'数字（分数は 3/4、帯分数は 1と3/4）':'答え';
  return `<input data-ans="${it.uid}" value="${esc(it.user)}" placeholder="${ph}" size="22" ${dis}> ${esc(it.suffix||'')}`;
}

window.QC={UNITS,SUBJ_ORDER,SUBJ_KEY,WEAK_UNIT_MAP,unitOf,rngFrom,GENS,BANK,allBank,isCorrect,parseNum,makeItem,itemFromSpec,specOf,qv,SVG,stars,nl2br,inputHtml,esc};
})();

<script>/* 子ども用ページ：保護者から届いたリンクの中身（問題の設計図）から、問題を作り直して解く。
 * 答えは、この端末のブラウザ（localStorage）に保存される。
 * 採点が終わると、結果を自動で送る。送り先は、リンクに入っている保護者のGoogleフォームだけ（docs.google.com/forms 以外には送らない）。
 * 送れなかったときは、電波のあるところで開くと、あとから自動で送る。 */
(function(){
'use strict';
const QC=window.QC, esc=QC.esc, $=id=>document.getElementById(id);
const LS='jk-kid-v1:';
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayKey=()=>ymd(new Date(Date.now()-5*3600e3));            /* 朝5時に日付が変わる */
const DOW='日月火水木金土';
const mdw=key=>{ const d=new Date(key+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; };
/* 日本語の答えも入るので、UTF-8のバイト列にしてから base64url にする（btoa は日本語をそのままでは扱えない） */
const toBin=s=>{ let o=''; new TextEncoder().encode(s).forEach(c=>{ o+=String.fromCharCode(c); }); return o; };
const fromBin=b=>new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)));
const b64u=s=>btoa(toBin(s)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=t=>fromBin(atob(t.replace(/-/g,'+').replace(/_/g,'/')));

/* ---------- リンクの読み取り ---------- */
let payload=null, loadError='';
function loadPayload(forced){
  const h=forced!==undefined?forced:location.hash.replace(/^#/,'');
  let text=h||lsGet(LS+'payload')||'';
  if(!text){ loadError='none'; return; }
  try{
    const j=JSON.parse(unb64u(text));
    if(!j||!Array.isArray(j.tests)) throw 0;
    payload=j; if(h) lsSet(LS+'payload',h);
  }catch(e){ loadError='broken'; }
}
/* 各回の保存（答え・採点済みか・送信ずみか） */
const getSave=id=>{ try{ return JSON.parse(lsGet(LS+'t:'+id)||'null')||{a:[],graded:false}; }catch(e){ return {a:[],graded:false}; } };
const putSave=(id,v)=>lsSet(LS+'t:'+id,JSON.stringify(v));

/* ---------- 結果の自動送信（保護者のGoogleフォームへ） ---------- */
function endpoint(){
  const f=payload&&payload.f; if(!f) return null;
  if(!/^https:\/\/docs\.google\.com\/forms\/d\/e\/[A-Za-z0-9_-]+\/formResponse$/.test(String(f.u))) return null;
  if(!/^entry\.\d+$/.test(String(f.e))) return null;
  return f;
}
async function postText(text){
  const f=endpoint(); if(!f) return false;
  try{
    await fetch(f.u,{method:'POST',mode:'no-cors',credentials:'omit',body:new URLSearchParams({[f.e]:text})});
    return true;
  }catch(e){ return false; }
}
function codeFor(t,sv){
  return 'JK1.'+b64u(JSON.stringify({id:t.id,a:sv.a.map(x=>x==null?'':String(x)),t:sv.gradedAt||'',s:(payload&&payload.s)||''}));
}
let flushing=false;
/* 採点ずみで、まだ送れていない回を送る。何回呼んでも、送れた回は二重に送らない */
async function flush(){
  if(flushing||!payload||!endpoint()) return;
  flushing=true;
  try{
    for(const t of payload.tests){
      const sv=getSave(t.id); if(!sv.graded||sv.sent) continue;
      if(await postText(codeFor(t,sv))){ sv.sent=true; sv.sentAt=new Date().toISOString(); putSave(t.id,sv); if(current&&current.meta.id===t.id) current.save=sv; }
    }
  } finally { flushing=false; }
}
function sendNote(t){
  const sv=getSave(t.id);
  if(!endpoint()) return {cls:'warn',text:'自動で送る設定がありません。下の結果コードを、保護者に送ってください。'};
  return sv.sent?{cls:'good',text:'保護者に送りました ✓'}:{cls:'warn',text:'まだ送れていません。電波のあるところで、このページをもう一度開くと、自動で送ります。'};
}

/* ---------- 画面 ---------- */
let current=null; /* いま開いている回 {meta, items, save} */
function titleOf(t){ return t.type==='weekly'?`週末テスト（${t.items.length}問）`:`今日のテスト（${mdw(t.key)}・${t.items.length}問）`; }
function stateOf(t){ const sv=getSave(t.id); return sv.graded?'done':sv.a.some(x=>x)?'part':'new'; }
const fallbackBox=(id,code,note)=>`<details class="foot"><summary>うまく送れないときは</summary><p class="muted">下の文字をコピーして、保護者に送ってください。</p>${codeBox(id,code,note)}</details>`;

function renderHome(){
  current=null; window.scrollTo(0,0);
  const main=$('main');
  if(loadError==='none'){ main.innerHTML=`<div class="card"><h2>リンクを開いてください</h2><p>保護者から届いた、テストのリンクを開くと、ここに問題が出ます。</p></div>`; return; }
  if(loadError==='broken'){ main.innerHTML=`<div class="card"><h2>リンクが読み取れませんでした</h2><p>リンクの最後までが、そろっていないようです。保護者に、もう一度送ってもらってください。</p></div>`; return; }
  if(payload.qv!==QC.qv()){ main.innerHTML=`<div class="card"><h2>新しいリンクが必要です</h2><p>このページとリンクのバージョンが合っていません。保護者に、新しいリンクを作って送ってもらってください。</p></div>`; return; }
  const today=todayKey();
  const tests=payload.tests.filter(t=>t.type==='weekly'?t.key<=today:t.key===today);
  let h='';
  if(!tests.length){
    h+=`<div class="card"><h2>今日のテストは、まだありません</h2><p>保護者に、新しいリンクを送ってもらってください。</p></div>`;
  }
  tests.sort((a,b)=>(a.type==='weekly'?0:1)-(b.type==='weekly'?0:1));
  for(const t of tests){
    const st=stateOf(t), lab={new:'まだ',part:'とちゅう',done:'おわり ✓'}[st];
    const note=st==='done'?sendNote(t):null;
    h+=`<div class="card row between"><div><h2>${esc(titleOf(t))}</h2><span class="tag ${st==='done'?'good':st==='part'?'warn':''}">${lab}</span>${note?` <span class="tag ${note.cls}">${note.cls==='good'?'送信ずみ':'送信まち'}</span>`:''}</div>
      <button class="btn" data-open="${esc(t.id)}">${st==='done'?'結果を見る':st==='part'?'つづける':'はじめる'}</button></div>`;
  }
  // 自動で送れていない結果があるときだけ、予備の手段を出す
  const unsent=payload.tests.filter(t=>{ const sv=getSave(t.id); return sv.graded&&!sv.sent; });
  if(unsent.length){
    const all=unsent.map(t=>codeFor(t,getSave(t.id))).join('\n');
    h+=`<div class="card"><h2>まだ送れていない結果が${unsent.length}回分あります</h2><p class="muted">電波のあるところで、このページを開いたままにすると、自動で送ります。</p>
      <div class="row"><button class="btn" data-resend>いま送る</button></div>${fallbackBox('allCode',all,unsent.length+'回分')}</div>`;
  }
  if(endpoint()) h+=`<details class="foot"><summary>保護者用</summary><p class="muted">結果が保護者のところに届くかを、確かめるボタンです。</p><div class="row"><button class="btn ghost" data-testsend>送信テスト</button></div></details>`;
  if(payload.made) h+=`<p class="muted foot">リンクの作成日：${esc(mdw(payload.made))}</p>`;
  main.innerHTML=h; bindCodeBoxes();
  flush().then(()=>{ if(!current&&unsent.length&&payload.tests.every(t=>{ const sv=getSave(t.id); return !sv.graded||sv.sent; })) renderHome(); });
}
function codeBox(id,code,note){
  return `<textarea id="${id}" class="code" readonly rows="3">${esc(code)}</textarea>
    <div class="row"><button class="btn" data-copy="${id}">コピー</button><button class="btn ghost" data-share="${id}" hidden>共有</button><span class="muted">${esc(note||'')}</span></div>`;
}
function bindCodeBoxes(){ document.querySelectorAll('[data-share]').forEach(b=>{ b.hidden=!navigator.share; }); }

function openTest(id){
  const meta=payload.tests.find(t=>t.id===id); if(!meta) return;
  let items; try{ items=meta.items.map(QC.itemFromSpec); }catch(e){ $('main').innerHTML=`<div class="card"><h2>問題を読み込めませんでした</h2><p>保護者に、新しいリンクを送ってもらってください。</p></div>`; return; }
  const sv=getSave(id); items.forEach((it,i)=>{ it.user=sv.a[i]==null?'':String(sv.a[i]); });
  current={meta,items,save:sv}; renderTest(); window.scrollTo(0,0);
  if(sv.graded) flush().then(()=>{ if(current&&current.meta.id===id) renderTest(); });
}
function renderTest(){
  const {meta,items,save:sv}=current, graded=sv.graded;
  let h=`<div class="row between"><button class="btn ghost" data-home>← もどる</button><span class="tag ${graded?'good':''}">${graded?'採点ずみ':'とちゅうまで自動で保存されます'}</span></div>
    <h2 class="ttl">${esc(titleOf(meta))}</h2>`;
  if(graded){
    items.forEach(it=>{ it.ok=QC.isCorrect(it,it.user); });
    const ok=items.filter(i=>i.ok).length, note=sendNote(meta);
    h+=`<div class="card"><h2>結果：${ok} / ${items.length}問</h2><p class="muted" style="margin:0 0 6px">まちがえた問題は、あとで出なおします。</p><span class="tag ${note.cls}">${esc(note.text)}</span>
      ${endpoint()&&!sv.sent?`<div class="row" style="margin-top:8px"><button class="btn" data-resend>いま送る</button></div>`:''}</div>`;
  }
  h+=items.map((it,ix)=>{
    const u=QC.UNITS[it.unit], dis=graded?'disabled':'';
    const res=graded?`<div class="res"><b class="${it.ok?'okc':'ngc'}">${it.ok?'○ 正解':'× 不正解'}</b>　正解：<b>${esc(it.ansText)}${esc(it.suffix||'')}</b>
        ${it.type==='choice'&&!it.ok&&it.user!==''?`<span class="muted">（あなたの答え：${esc(it.choices[+it.user])}）</span>`:''}
        <div>${QC.nl2br(it.explain||'')}</div></div>`:'';
    return `<div class="card ${graded?(it.ok?'ok':'ng'):''}">
      <div class="row between"><b>第${ix+1}問</b><span class="row"><span class="tag">${esc(u.subj)}</span><span class="tag">${esc(u.name)}</span></span></div>
      <p class="q">${QC.nl2br(it.text)}</p>${it.svg?`<div class="fig">${QC.SVG[it.svg]}<div class="muted">※図は正確ではありません</div></div>`:''}
      <div>${QC.inputHtml(it,dis)}</div>${res}</div>`;
  }).join('');
  if(!graded) h+=`<div class="card center"><button class="btn big" data-grade>採点する</button><p class="muted">空らんがあると、まちがいになります。採点すると、結果は自動で保護者に届きます。</p></div>`;
  else if(!sv.sent) h+=`<div class="card">${fallbackBox('code',codeFor(meta,sv),'この回の結果コード')}</div>`;
  $('main').innerHTML=h; bindCodeBoxes();
}
let saveTimer=null;
function saveAnswers(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ if(current&&!current.save.graded) putSave(current.meta.id,current.save); },200); }

/* ---------- 操作 ---------- */
function confirmBox(msg){ return new Promise(res=>{ const b=$('ask'); $('askMsg').textContent=msg; b.hidden=false; $('askOk').focus(); const done=v=>{ b.hidden=true; res(v); }; $('askOk').onclick=()=>done(true); $('askNo').onclick=()=>done(false); }); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }
async function copyFrom(id){
  const ta=$(id); if(!ta) return; ta.focus(); ta.select();
  try{ await navigator.clipboard.writeText(ta.value); toast('コピーしました'); }
  catch(e){ try{ ta.setSelectionRange(0,ta.value.length); document.execCommand('copy'); toast('コピーしました'); }catch(e2){ toast('選んだ文字を、長押ししてコピーしてください'); } }
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-open],[data-home],[data-grade],[data-copy],[data-share],[data-resend],[data-testsend]'); if(!t) return;
  if(t.dataset.open) return openTest(t.dataset.open);
  if('home' in t.dataset) return renderHome();
  if(t.dataset.copy) return copyFrom(t.dataset.copy);
  if(t.dataset.share){ const ta=$(t.dataset.share); try{ await navigator.share({text:ta.value}); }catch(err){} return; }
  if('resend' in t.dataset){ await flush(); toast(payload.tests.every(x=>{ const sv=getSave(x.id); return !sv.graded||sv.sent; })?'送りました':'まだ送れていません。電波のあるところで、もう一度ためしてください'); if(current) renderTest(); else renderHome(); return; }
  if('testsend' in t.dataset){ const ok=await postText('JKTEST.'+((payload&&payload.s)||'')+'.'+Date.now()); toast(ok?'テストを送りました。保護者のポータルで、届いたか確かめてください':'送れませんでした。電波のあるところで、もう一度ためしてください'); return; }
  if('grade' in t.dataset && current){
    const blank=current.items.filter(i=>i.user==='').length;
    if(blank&&!(await confirmBox(`${blank}問が空らんです。採点しますか？（空らんはまちがいになります）`))) return;
    current.save.a=current.items.map(i=>i.user); current.save.graded=true; current.save.gradedAt=new Date().toISOString().slice(0,19); putSave(current.meta.id,current.save);
    renderTest(); window.scrollTo(0,0);
    const id=current.meta.id;
    await flush(); if(current&&current.meta.id===id) renderTest();
  }
});
document.addEventListener('input',e=>{
  const id=e.target.dataset&&e.target.dataset.ans; if(!id||!current||current.save.graded) return;
  const i=current.items.findIndex(x=>x.uid===id); if(i<0) return;
  current.items[i].user=e.target.value; current.save.a=current.items.map(x=>x.user); saveAnswers();
});
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.ans; if(!id||!current||current.save.graded||e.target.type!=='radio') return;
  const i=current.items.findIndex(x=>x.uid===id); if(i<0) return;
  current.items[i].user=e.target.value; current.save.a=current.items.map(x=>x.user); saveAnswers();
});
window.addEventListener('hashchange',()=>{ loadError=''; payload=null; loadPayload(); renderHome(); });
window.addEventListener('pagehide',()=>{ if(current&&!current.save.graded) putSave(current.meta.id,current.save); });
window.addEventListener('online',()=>{ flush().then(()=>{ if(!current) renderHome(); }); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') flush(); });

loadPayload(); renderHome();
window.KID={loadPayload:()=>payload,current:()=>current,flush,load:t=>{ loadError=''; payload=null; loadPayload(t); renderHome(); }}; /* load は動作確認用 */
})();
</script>
</body>
</html>
